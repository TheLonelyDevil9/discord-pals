name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 matches the deployment host; 3.12 is the version README recommends.
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Quality checks
        run: python tools/quality_check.py

      # Run via `python -m` from the repo root: there is no conftest.py,
      # no tests/__init__.py and no pytest.ini, so the suite relies on the
      # working directory being on sys.path.
      - name: Tests
        run: python -m pytest -q
